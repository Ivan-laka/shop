<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Каталог</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Фиксированная тёмная тема с фиолетовым акцентом */
:root {
  --bg: #13111C;
  --bg2: #242032;
  --text: #F3F1F8;
  --hint: #8D879F;
  --accent: #9333EA;
  --atext: #FFFFFF;
  --line: #332E47;
}
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, sans-serif; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--text); padding-bottom: 96px; }

/* Окно 18+ */
.gate { position: fixed; inset: 0; background: var(--bg); z-index: 99; display: flex; flex-direction: column; justify-content: center; padding: 28px; gap: 14px; }
.gate h1 { font-size: 26px; color: var(--text); }
.gate p { color: var(--hint); }
.gate button { width: 100%; height: 50px; border: 0; border-radius: 14px; background: var(--accent); color: var(--atext); font-weight: 600; font-size: 16px; cursor: pointer; }
.gate .no { background: var(--bg2); color: var(--text); }
.gate .ver { font-size: 12px; text-align: center; }

/* Шапка */
header { position: sticky; top: 0; background: rgba(19, 17, 28, 0.9); backdrop-filter: blur(10px); padding: 12px 16px; z-index: 10; border-bottom: 1px solid var(--line); }
input { width: 100%; height: 44px; border: 0; border-radius: 12px; background: var(--bg2); color: var(--text); padding: 0 16px; font-size: 16px; outline: none; transition: 0.2s; }
input:focus { outline: 2px solid var(--accent); }
input::placeholder { color: var(--hint); }
.chips { display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { border: 0; border-radius: 20px; padding: 8px 16px; background: var(--bg2); color: var(--text); font-size: 14px; font-weight: 500; white-space: nowrap; cursor: pointer; transition: 0.2s; }
.chip.active { background: var(--accent); color: var(--atext); box-shadow: 0 4px 12px rgba(147, 51, 234, 0.3); }

/* Сетка товаров */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 16px; }
.card { display: flex; flex-direction: column; background: var(--bg2); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
.img-ph { aspect-ratio: 1; background: #1C1929; display: flex; align-items: center; justify-content: center; color: var(--hint); font-size: 12px; }
.info { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; gap: 8px; }
.nm { font-size: 14px; font-weight: 500; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--text); }
.bot { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
.pr { font-size: 16px; font-weight: 700; color: #E9D5FF; }

/* Кнопки +/- */
.btn-add { width: 32px; height: 32px; border: 0; border-radius: 50%; background: var(--accent); color: var(--atext); font-size: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(147, 51, 234, 0.4); }
.ctrl { display: flex; align-items: center; background: #1C1929; border-radius: 16px; height: 32px; border: 1px solid var(--line); }
.ctrl button { width: 32px; height: 32px; background: none; border: 0; color: var(--text); font-size: 18px; cursor: pointer; }
.ctrl span { min-width: 24px; text-align: center; font-weight: 600; font-size: 14px; }

/* Корзина */
.cart-head { padding: 16px; border-bottom: 1px solid var(--line); background: var(--bg2); display: flex; align-items: center; gap: 12px; }
.cart-head h2 { font-size: 20px; }
.back { border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 12px; padding: 8px 12px; font-size: 14px; cursor: pointer; }
.cart-item { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--line); background: var(--bg); }
.cart-item .nm { -webkit-line-clamp: unset; font-size: 15px; margin-bottom: 6px; }
.empty { padding: 40px 16px; text-align: center; color: var(--hint); }
.sum-box { padding: 20px 16px; font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; background: var(--bg2); border-top: 1px solid var(--line); }
.sum-box span:last-child { color: #E9D5FF; }

/* Нижняя кнопка (только вне Telegram, для проверки в браузере) */
#bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); z-index: 20; }
#bar button { width: 100%; height: 50px; border: 0; border-radius: 14px; background: var(--accent); color: var(--atext); font-size: 16px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>

<div class="gate" id="gate">
  <h1>Вам есть 18 лет?</h1>
  <p>Товары в каталоге предназначены только для совершеннолетних.</p>
  <button id="yes">Да, мне есть 18</button>
  <button class="no" id="no">Нет</button>
  <p class="ver">версия 4</p>
</div>

<div id="view-list">
  <header>
    <input id="q" placeholder="Поиск..." autocomplete="off">
    <div class="chips" id="chips"></div>
  </header>
  <div class="grid" id="grid"></div>
</div>

<div id="view-cart" hidden>
  <div class="cart-head">
    <button class="back" id="backBtn" hidden>← Назад</button>
    <h2>Корзина</h2>
  </div>
  <div id="cart-list"></div>
  <div class="sum-box" id="cart-sum"></div>
</div>

<div id="bar" hidden><button id="barBtn"></button></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
// Внутри Telegram платформа не "unknown". (initData для кнопок клавиатуры бывает пустой, поэтому по нему не определяем.)
const inTg = !!(tg && tg.platform && tg.platform !== "unknown");
const CUR = "₽";
const fmt = n => n.toLocaleString("ru-RU") + " " + CUR;
const $ = id => document.getElementById(id);

let CATALOG = [];
let cats = ["Все"];
let cart = {};
let activeCat = "Все";
let q = "";
let currentView = "list"; // list или cart

// Загрузка товаров
async function init() {
  try {
    const res = await fetch('products.json?v=' + Date.now());
    const data = await res.json();
    for (let id in data) {
      CATALOG.push({ id, nm: data[id].name, pr: data[id].price, cat: data[id].category || "Товары" });
    }
    cats = ["Все", ...new Set(CATALOG.map(c => c.cat))];
    renderChips();
    renderGrid();
  } catch (e) {
    $('grid').innerHTML = '<div class="empty" style="grid-column: span 2;">Ошибка загрузки товаров.</div>';
  }
}

// Кнопки +/-
function getCtrl(id) {
  const count = cart[id] || 0;
  if (count === 0) return `<button class="btn-add" onclick="chg('${id}', 1)">+</button>`;
  return `<div class="ctrl"><button onclick="chg('${id}', -1)">−</button><span>${count}</span><button onclick="chg('${id}', 1)">+</button></div>`;
}

window.chg = (id, delta) => {
  cart[id] = Math.max(0, (cart[id] || 0) + delta);
  if (cart[id] === 0) delete cart[id];
  try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) {}
  if (currentView === "list") {
    const box = $(`ctrl-box-${id}`);
    if (box) box.innerHTML = getCtrl(id);
  } else {
    renderCart();
  }
  updateMainButton();
};

function renderChips() {
  $('chips').innerHTML = cats.map(c =>
    `<button class="chip ${c === activeCat ? 'active' : ''}" onclick="setCat('${c}')">${c}</button>`
  ).join("");
}
window.setCat = (c) => { activeCat = c; renderChips(); renderGrid(); };

function renderGrid() {
  const filtered = CATALOG.filter(c => (activeCat === "Все" || c.cat === activeCat) && c.nm.toLowerCase().includes(q));
  if (!filtered.length) {
    $('grid').innerHTML = '<div class="empty" style="grid-column: span 2;">Ничего не найдено</div>';
    return;
  }
  $('grid').innerHTML = filtered.map(c => `
    <div class="card">
      <div class="img-ph">Нет фото</div>
      <div class="info">
        <div class="nm">${c.nm}</div>
        <div class="bot">
          <span class="pr">${fmt(c.pr)}</span>
          <div id="ctrl-box-${c.id}">${getCtrl(c.id)}</div>
        </div>
      </div>
    </div>
  `).join("");
}

function renderCart() {
  const ids = Object.keys(cart);
  if (!ids.length) {
    $('cart-list').innerHTML = '<div class="empty">Корзина пуста</div>';
    $('cart-sum').innerHTML = '';
    return;
  }
  let total = 0;
  $('cart-list').innerHTML = ids.map(id => {
    const item = CATALOG.find(c => c.id === id);
    total += item.pr * cart[id];
    return `
      <div class="cart-item">
        <div style="flex:1; padding-right:12px;">
          <div class="nm">${item.nm}</div>
          <div class="pr">${fmt(item.pr)}</div>
        </div>
        <div>${getCtrl(id)}</div>
      </div>`;
  }).join("");
  $('cart-sum').innerHTML = `<span>Итого:</span><span>${fmt(total)}</span>`;
}

// Главная кнопка (в Telegram — нативная, вне Telegram — нижняя панель)
function updateMainButton() {
  const n = Object.values(cart).reduce((a, b) => a + b, 0);
  let sum = 0;
  Object.keys(cart).forEach(id => { sum += CATALOG.find(c => c.id === id).pr * cart[id]; });
  const label = currentView === "list" ? `Корзина · ${fmt(sum)}` : `Оформить заказ · ${fmt(sum)}`;
  if (inTg) {
    if (n) { tg.MainButton.setText(label); tg.MainButton.show(); } else tg.MainButton.hide();
  } else {
    $('bar').hidden = !n;
    $('barBtn').textContent = label;
  }
}

function showCart() {
  currentView = "cart";
  $('view-list').hidden = true;
  $('view-cart').hidden = false;
  if (inTg) tg.BackButton.show(); else $('backBtn').hidden = false;
  renderCart();
  updateMainButton();
  window.scrollTo(0, 0);
}
function showList() {
  currentView = "list";
  $('view-list').hidden = false;
  $('view-cart').hidden = true;
  if (inTg) tg.BackButton.hide();
  renderGrid();
  updateMainButton();
  window.scrollTo(0, 0);
}
function sendOrder() {
  const order = { i: Object.entries(cart).map(([id, n]) => [+id, n]) };
  if (inTg) tg.sendData(JSON.stringify(order));
  else alert("Данные заказа:\n" + JSON.stringify(order));
}
function mainAction() { currentView === "list" ? showCart() : sendOrder(); }

if (inTg) {
  tg.ready();
  tg.expand();
  try {
    tg.setHeaderColor("#13111C");
    tg.setBackgroundColor("#13111C");
    tg.MainButton.setParams({ color: "#9333EA", text_color: "#FFFFFF" });
  } catch (e) {}
  tg.MainButton.onClick(mainAction);
  tg.BackButton.onClick(showList);
}
$('barBtn').onclick = mainAction;
$('backBtn').onclick = showList;
$('q').addEventListener('input', e => { q = e.target.value.trim().toLowerCase(); renderGrid(); });

// 18+
let ok = false;
try { ok = localStorage.getItem("age18") === "1"; } catch (e) {}
$('gate').hidden = ok;
if (ok) init();
$('yes').onclick = () => {
  try { localStorage.setItem("age18", "1"); } catch (e) {}
  $('gate').hidden = true;
  init();
};
$('no').onclick = () => { inTg ? tg.close() : (document.body.innerHTML = "<p style='padding:30px'>Доступ закрыт.</p>"); };
</script>
</body>
</html>
