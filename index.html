<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f172a;        /* Темный графит */
            --card: rgba(30, 41, 59, 0.7); /* Прозрачное стекло */
            --accent: #10b981;    /* Изумрудный неон */
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --error: #ef4444;
        }
        body { 
            background: var(--bg); color: var(--text); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; padding: 15px; padding-bottom: 80px; 
        }
        /* Эффект стекла для карточек */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .card { 
            background: var(--card); border-radius: 16px; padding: 12px; text-align: center;
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .card img { width: 100%; border-radius: 10px; height: 130px; object-fit: cover; margin-bottom: 10px; }
        .title { font-weight: 600; font-size: 0.95em; margin-bottom: 5px; }
        .price { color: var(--accent); font-weight: 800; font-size: 1.2em; margin-bottom: 10px; }
        
        /* Бейджи наличия */
        .stock-badge { font-size: 0.75em; font-weight: 700; padding: 4px 8px; border-radius: 8px; display: inline-block; margin-bottom: 10px; }
        .in-stock { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .out-stock { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        
        /* Кнопки */
        button { 
            background: var(--accent); color: #fff; border: none; padding: 10px 15px; 
            border-radius: 10px; width: 100%; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        button:active { transform: scale(0.95); }
        button:disabled { background: #334155; color: var(--text-muted); cursor: not-allowed; }
        
        /* Нижняя панель корзины */
        #cart-bar { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px);
            padding: 15px 20px; box-sizing: border-box; border-top: 1px solid rgba(255,255,255,0.05);
            display: flex; justify-content: space-between; align-items: center; z-index: 100;
        }
        #cart-bar button { width: auto; padding: 12px 24px; }
        .total-price { font-size: 1.2em; font-weight: bold; }
    </style>
</head>
<body>
    <div class="grid" id="catalog"></div>

    <div id="cart-bar" style="display: none;">
        <div class="total-price"><span id="total">0</span> ₽</div>
        <button onclick="sendOrder()">Оформить</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        let cart = {};
        let globalProducts = {};

        fetch('products.json?v=' + new Date().getTime())
            .then(r => r.json())
            .then(data => {
                globalProducts = data;
                const cat = document.getElementById('catalog');
                
                for (let id in data) {
                    let p = data[id];
                    if (p.archived) continue; // Не показываем скрытые
                    
                    // Если у старых товаров нет поля stock, считаем что их 999
                    let stock = p.stock !== undefined ? p.stock : 999; 
                    
                    let stockHtml = stock > 0 
                        ? `<div class="stock-badge in-stock">В наличии: ${stock}</div>` 
                        : `<div class="stock-badge out-stock">Нет в наличии</div>`;
                        
                    let btnHtml = stock > 0
                        ? `<button onclick="addToCart('${id}')">В корзину</button>`
                        : `<button disabled>Раскупили</button>`;

                    cat.innerHTML += `
                        <div class="card">
                            <div>
                                <img src="${p.img || 'https://via.placeholder.com/150'}" alt="">
                                <div class="title">${p.name}</div>
                                <div class="price">${p.price} ₽</div>
                                ${stockHtml}
                            </div>
                            ${btnHtml}
                        </div>
                    `;
                }
            });

        function addToCart(id) {
            let p = globalProducts[id];
            let maxStock = p.stock !== undefined ? p.stock : 999;
            
            if (!cart[id]) cart[id] = 0;
            if (cart[id] < maxStock) {
                cart[id]++;
                updateCartUI();
                tg.HapticFeedback.impactOccurred('light');
            } else {
                tg.showAlert('Больше нет в наличии!');
            }
        }

        function updateCartUI() {
            let totalSum = 0;
            let itemsCount = 0;
            
            for (let id in cart) {
                itemsCount += cart[id];
                totalSum += globalProducts[id].price * cart[id];
            }
            
            document.getElementById('total').innerText = totalSum;
            document.getElementById('cart-bar').style.display = itemsCount > 0 ? 'flex' : 'none';
        }

        function sendOrder() {
            let orderData = { i: Object.entries(cart) };
            tg.sendData(JSON.stringify(orderData));
        }
    </script>
</body>
</html>
