<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Каталог</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--bg2:var(--tg-theme-secondary-bg-color,#f1f3f5);--text:var(--tg-theme-text-color,#14171a);--hint:var(--tg-theme-hint-color,#7b8794);--accent:var(--tg-theme-button-color,#2481cc);--atext:var(--tg-theme-button-text-color,#fff);--line:color-mix(in srgb,var(--hint) 25%,transparent)}
@media(prefers-color-scheme:dark){:root{--bg:var(--tg-theme-bg-color,#17212b);--bg2:var(--tg-theme-secondary-bg-color,#0e1621);--text:var(--tg-theme-text-color,#f5f5f5)}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:96px}
header{position:sticky;top:0;background:var(--bg);padding:12px 14px 8px;z-index:2;border-bottom:1px solid var(--line)}
input{width:100%;height:42px;border:0;border-radius:12px;background:var(--bg2);color:var(--text);padding:0 14px;font:inherit}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.chip{border:0;border-radius:18px;padding:7px 14px;background:var(--bg2);color:var(--text);font:inherit;font-size:14px;white-space:nowrap;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--atext)}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.info{flex:1;min-width:0}.nm{font-size:15px}.pr{font-weight:700;margin-top:3px}
.add,.st button{width:38px;height:38px;border:0;border-radius:12px;font-size:20px;cursor:pointer}
.add{background:var(--accent);color:var(--atext)}
.st{display:flex;align-items:center;background:var(--bg2);border-radius:12px}.st button{background:none;color:var(--text)}.st span{min-width:24px;text-align:center;font-weight:600}
.empty{padding:40px 14px;text-align:center;color:var(--hint)}
.sum{display:flex;justify-content:space-between;padding:16px 14px;font-weight:700;font-size:18px}
h2{padding:14px 14px 4px;font-size:20px}
#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
#bar button,.gate button{width:100%;height:50px;border:0;border-radius:14px;background:var(--accent);color:var(--atext);font:inherit;font-weight:600;cursor:pointer}
.gate{position:fixed;inset:0;background:var(--bg);z-index:9;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:28px}
.gate h1{font-size:26px}.gate p{color:var(--hint)}
.gate .no{background:var(--bg2);color:var(--text)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head><body>
<div class="gate" id="gate" hidden>
  <h1>Вам есть 18 лет?</h1>
  <p>Товары в каталоге предназначены только для совершеннолетних.</p>
  <button id="yes">Да, мне есть 18</button><button class="no" id="no">Нет</button>
</div>
<div id="app"></div>
<div id="bar" hidden><button id="barBtn"></button></div>
<script>
const CATALOG = [[1, "Жидкости", "D.L.T.A 50 MG (BURN drak energy цитрус)", 300], [2, "Жидкости", "D.L.T.A 50 MG (Blue energy)", 300], [3, "Жидкости", "D.L.T.A 50 MG (Burn tropical mix)", 300], [4, "Жидкости", "D.L.T.A Adrenaline 150 mg МИКС", 320], [5, "Жидкости", "D.L.T.A BURN 150 МГ МИКС", 320], [6, "Жидкости", "D.L.T.A Red Bull МИКС", 320], [7, "Жидкости", "EVIL HUSKY 60 MG (Ананасовые тропики)", 380], [8, "Жидкости", "EVIL HUSKY 60 MG (Арбузный фреш)", 380], [9, "Жидкости", "EVIL HUSKY 60 MG (Малина ежевика)", 380], [10, "Жидкости", "EVIL HUSKY 60 MG (Микс ягод)", 380], [11, "Жидкости", "ICEBERG HARDCORE (150 MG) - микс (5 вкусов)", 380], [12, "Жидкости", "ICEBERG OVERKILL (200 MG) - микс (6 вкусов)", 380], [13, "Жидкости", "ISTERIKA & Злая монашка 201MG - микс (12 вкусов)", 360], [14, "Жидкости", "KASTA COVID 228 МИКС", 240], [15, "Жидкости", "MONSTERVAPOR SOUR 7% - Гранат клюква", 380], [16, "Жидкости", "MONSTERVAPOR SOUR 7% - Киви лайм", 380], [17, "Жидкости", "MONSTERVAPOR SOUR 7% - Кислые Ананас Манго", 380], [18, "Жидкости", "PODONKI CRITICAL (Малина ежевика лед)", 380], [19, "Жидкости", "PODONKI CRITICAL (Яблочный холс)", 380], [20, "Жидкости", "Анархия V2 70 MG (Арбуз персик)", 340], [21, "Жидкости", "Анархия V2 70 MG (Зеленое яблоко)", 340], [22, "Жидкости", "Анархия V2 70 MG (Личи маракуйя)", 340], [23, "Жидкости", "Анархия V2 70 MG (Малиновый лимонад)", 340], [24, "Жидкости", "Анархия V2 70 MG (Манго малина)", 340], [25, "Жидкости", "Анархия V2 70 MG (Персик ананас)", 340], [26, "Жидкости", "Анархия V2 70 MG (Цитрусовый энергетик)", 340], [27, "Жидкости", "Анархия V2 70 MG (Энергетик с личи)", 340], [28, "Жидкости", "Злая лабуба extra hard (Арбуз земляника)", 320], [29, "Жидкости", "Злая лабуба extra hard (Арбуз малина)", 320], [30, "Жидкости", "Злая лабуба extra hard (Виноград малина)", 320], [31, "Жидкости", "Злая лабуба extra hard (Дыня)", 320], [32, "Жидкости", "Злая лабуба extra hard (Лесные ягоды)", 320], [33, "Жидкости", "Злая лабуба extra hard (Холодный виноград)", 320], [34, "Жидкости", "Злая монашка x HOTSPOT (Киви питайя алоэ)", 440], [35, "Жидкости", "Злая монашка x HOTSPOT (Яблоко маракуйя)", 440], [36, "Комплектующие", "Испаритель smoant K-1 (0.3 ом)", 180], [37, "Комплектующие", "Картридж Vaporesso xros (0.4 ом) 3 мл - 4 шт (пачка)", 940], [38, "Жидкости", "УБИВАШКА 80 MG (Малина банан)", 400], [39, "Жидкости", "УБИВАШКА 80 MG (Тропический смузи)", 400], [40, "Жидкости", "УБИВАШКА 80 MG (Фанта голубая малина)", 400], [41, "Жидкости", "УБИВАШКА 80 MG (Ягодный морс)", 400]]; // [id, категория, название, цена]
const CUR = "₽", tg = window.Telegram && window.Telegram.WebApp, inTg = !!(tg && tg.initData);
const fmt = n => n.toLocaleString("ru-RU") + " " + CUR, $ = id => document.getElementById(id);
const cart = {}; let view = "list", cat = "Все", q = "";
const cats = ["Все", ...new Set(CATALOG.map(c => c[1]))];
const byId = Object.fromEntries(CATALOG.map(c => [c[0], c]));
const count = () => Object.values(cart).reduce((a, b) => a + b, 0);
const total = () => Object.entries(cart).reduce((s, [id, n]) => s + byId[id][3] * n, 0);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const buzz = () => { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} };

function ctrl(id) {
  const n = cart[id] || 0;
  return n ? `<div class="st"><button data-a="-" data-id="${id}" aria-label="Меньше">−</button><span>${n}</span><button data-a="+" data-id="${id}" aria-label="Больше">+</button></div>`
           : `<button class="add" data-a="+" data-id="${id}" aria-label="В корзину">+</button>`;
}
function row(c) { return `<div class="item" id="r${c[0]}"><div class="info"><div class="nm">${esc(c[2])}</div><div class="pr">${fmt(c[3])}</div></div><div class="ctl">${ctrl(c[0])}</div></div>`; }

function renderList() {
  const s = q.trim().toLowerCase();
  const rows = CATALOG.filter(c => (cat === "Все" || c[1] === cat) && c[2].toLowerCase().includes(s));
  $("app").innerHTML = `<header><input id="q" placeholder="Поиск" value="${esc(q)}" autocomplete="off"><div class="chips">${cats.map(c => `<button class="chip" data-cat="${c}" aria-pressed="${c === cat}">${c}</button>`).join("")}</div></header><div id="rows">${rows.map(row).join("") || '<div class="empty">Ничего не найдено</div>'}</div>`;
  $("q").oninput = e => { q = e.target.value; const pos = e.target.selectionStart; renderList(); const i = $("q"); i.focus(); i.setSelectionRange(pos, pos); };
}
function renderCart() {
  const ids = Object.keys(cart);
  $("app").innerHTML = `<h2>Корзина</h2>` + (ids.length ? ids.map(id => row(byId[id])).join("") + `<div class="sum"><span>Итого</span><span>${fmt(total())}</span></div>` : '<div class="empty">Корзина пуста</div>');
}
function bar() {
  const n = count(); let label = "", show = false;
  if (view === "list" && n) { label = `Корзина · ${n} шт · ${fmt(total())}`; show = true; }
  if (view === "cart" && n) { label = `Оформить заказ · ${fmt(total())}`; show = true; }
  if (inTg) { if (show) { tg.MainButton.setText(label); tg.MainButton.show(); } else tg.MainButton.hide(); }
  else { $("bar").hidden = !show; $("barBtn").textContent = label; }
}
function go(v) { view = v; if (inTg) { v === "cart" ? tg.BackButton.show() : tg.BackButton.hide(); } v === "cart" ? renderCart() : renderList(); bar(); window.scrollTo(0, 0); }
function action() {
  if (view === "list") return go("cart");
  const order = { i: Object.entries(cart).map(([id, n]) => [+id, n]) };
  if (inTg) tg.sendData(JSON.stringify(order)); else alert("Тест вне Telegram:\n" + JSON.stringify(order));
}
document.addEventListener("click", e => {
  const ch = e.target.closest("[data-cat]"); if (ch) { cat = ch.dataset.cat; return renderList(); }
  const b = e.target.closest("[data-a]"); if (!b) return;
  const id = b.dataset.id; cart[id] = Math.max(0, (cart[id] || 0) + (b.dataset.a === "+" ? 1 : -1)); buzz();
  if (!cart[id]) delete cart[id];
  if (view === "cart") { Object.keys(cart).length ? renderCart() : renderCart(); }
  else { const r = $("r" + id); if (r) r.querySelector(".ctl").innerHTML = ctrl(id); }
  bar();
});
$("barBtn").onclick = action;
if (inTg) { tg.ready(); tg.expand(); tg.MainButton.onClick(action); tg.BackButton.onClick(() => go("list")); }

let ok = false; try { ok = localStorage.getItem("age18") === "1"; } catch (e) {}
$("gate").hidden = ok;
$("yes").onclick = () => { try { localStorage.setItem("age18", "1"); } catch (e) {} $("gate").hidden = true; };
$("no").onclick = () => { inTg ? tg.close() : (document.body.innerHTML = "<p style='padding:30px'>Доступ закрыт.</p>"); };
go("list");
</script></body></html>
